<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Day</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8ec;
    --muted: #8a90a0; --accent: #5b9dff; --good: #4caf7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #state { font-size: 13px; color: var(--muted); }
  #state b { color: var(--accent); }
  main { flex: 1; display: flex; min-height: 0; }
  #log {
    flex: 1; overflow-y: auto; padding: 12px 16px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
    white-space: pre-wrap;
  }
  .entry { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
  .entry .meta { color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .entry .meta .user { color: var(--good); font-weight: 600; }
  .entry .cmd { color: var(--accent); }
  footer {
    border-top: 1px solid var(--border); padding: 10px 16px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  input, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 14px;
  }
  #name { width: 90px; }
  #cmd { flex: 1; min-width: 160px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 8px; }
  .quick button { font-size: 12px; padding: 5px 9px; }

  /* ---------- Top-3 recommendation table ---------- */
  .aseed { white-space: nowrap; margin-right: 6px; }
  .top3 { white-space: normal; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 6px 0 4px; }
  .t3-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 8px; }
  .t3-title { font-size: 15px; font-weight: 600; }
  .t3-sub { font-size: 12px; color: var(--muted); }
  .t3-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  table.t3 { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.t3 th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11px; padding: 7px 10px; white-space: nowrap; }
  table.t3 th.l, table.t3 td.l { text-align: left; }
  table.t3 tr.grp th { text-align: center; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: .05em; font-size: 10px; padding: 6px 10px 4px; }
  table.t3 tr.grp th.gsep, table.t3 td.gsep, table.t3 tr.cols th.gsep { border-left: 1px solid var(--border); }
  table.t3 tr.cols th { border-bottom: 1px solid var(--border); }
  table.t3 tr.main td { padding: 10px; text-align: right; vertical-align: middle; border-top: 1px solid var(--border); cursor: pointer; white-space: nowrap; }
  table.t3 tbody tr.main:first-child td { border-top: none; }
  table.t3 tr.main:hover td { background: rgba(91,157,255,.06); }
  table.t3 tr.main.best td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  table.t3 tr.main td.l { text-align: left; }
  .t3-rest { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .t3 .dgrid > span { min-width: 0; }
  .t3 .rank { font-weight: 700; color: var(--accent); width: 28px; text-align: center !important; }
  .t3 .pname { font-weight: 600; font-size: 14px; }
  .t3 .pos { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 600; background: #232837; color: var(--muted); vertical-align: 1px; }
  .t3 .tag { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 600; background: rgba(91,157,255,.15); color: var(--accent); vertical-align: 1px; }
  .t3 .chev { color: var(--muted); font-size: 10px; margin-left: 6px; }
  .t3 .pv { display: inline-block; min-width: 46px; font-variant-numeric: tabular-nums; }
  .t3 .bar { display: inline-block; width: 46px; height: 5px; background: #232837; border-radius: 3px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .t3 .bar > span { display: block; height: 100%; background: #5d6478; border-radius: 3px; }
  .t3 .bar.hit > span { background: var(--good); }
  .t3 .hitv { color: var(--good); font-weight: 600; }
  .t3 .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .t3 .pill.met { background: rgba(76,175,125,.18); color: var(--good); }
  .t3 .pill.no { background: #232837; color: var(--muted); }
  table.t3 tr.detail td { padding: 0; border-top: none; }
  table.t3 tr.detail.closed { display: none; }
  .t3 .dgrid { display: grid; grid-template-columns: 110px 1fr; gap: 5px 12px; padding: 4px 14px 12px 42px; font-size: 12.5px; line-height: 1.45; white-space: normal; }
  .t3 .dgrid .k { color: var(--muted); }
  .t3 .warn { color: #e0a84a; font-weight: 600; }
  .t3-foot { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
  .t3-foot details { margin-top: 4px; }
  .t3-foot summary { cursor: pointer; color: var(--accent); }
  .t3-foot dl { display: grid; grid-template-columns: 110px 1fr; gap: 3px 12px; margin: 6px 0 2px; }
  .t3-foot dt { color: var(--text); } .t3-foot dd { margin: 0; }
  @media (max-width: 720px) {
    .t3-wrap { border: none; background: none; }
    table.t3, table.t3 tbody { display: block; }
    table.t3 thead { display: none; }
    table.t3 tr.main { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px 8px 0 0; padding: 10px 12px; margin-top: 10px; }
    table.t3 tr.main.best { border-color: var(--accent); }
    table.t3 tr.main:has(+ tr.detail.closed) { border-radius: 8px; }
    table.t3 tr.main td { border: none !important; padding: 0 !important; text-align: left; box-shadow: none !important; background: none !important; }
    table.t3 tr.main td.pcell { grid-column: 1 / -1; }
    table.t3 tr.main td.rank { display: none; }
    table.t3 tr.main td[data-label]::before { content: attr(data-label); display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 1px; }
    table.t3 tr.detail { display: block; background: var(--panel); border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; }
    table.t3 tr.detail td { display: block; }
    .t3 .dgrid { grid-template-columns: 1fr; padding: 0 12px 10px; gap: 0; }
    .t3 .dgrid .k { margin-top: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  }

  /* ---------- Reports panel (buttons) ---------- */
  .reports { padding: 0 16px 8px; }
  .reports summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .rrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 5px; }
  .rlabel { width: 74px; font-size: 12px; color: var(--muted); }
  .rrow button { font-size: 12px; padding: 4px 9px; }
  .rrow button.blend { border-color: #3a4a6b; }
  #busy { font-size: 12px; color: #e0a84a; }
  button:disabled { opacity: .5; cursor: progress; }

  /* ---------- Shared report styling ---------- */
  .rep { white-space: normal; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 6px 0 4px; }
  .rep-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 4px; }
  .rep-title { font-size: 15px; font-weight: 600; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; background: rgba(91,157,255,.15); color: var(--accent); }
  .rep-sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; line-height: 1.45; }
  .rep-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  table.rt { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.rt th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11px; padding: 7px 10px; white-space: nowrap; border-bottom: 1px solid var(--border); }
  table.rt td { padding: 7px 10px; text-align: right; white-space: nowrap; border-top: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  table.rt tbody tr:first-child td { border-top: none; }
  table.rt th.l, table.rt td.l { text-align: left; }
  table.rt tr.ally td:first-child, table.rt tr.ally td.l:first-of-type { box-shadow: inset 3px 0 0 var(--accent); }
  table.rt tr.ally { background: rgba(91,157,255,.06); }
  table.rt tr.cut td { border-bottom: 2px dashed #3a4256; }
  .tm b { font-weight: 600; } .tmn { color: var(--muted); font-size: 12px; } .star { color: #f0b840; font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .pill.bye { background: rgba(76,175,125,.18); color: var(--good); }
  .pos-n { color: var(--good); } .neg-n { color: #e0706a; }
  .muted { color: var(--muted); }
  .rep-foot { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .rep h4 { margin: 14px 0 6px; font-size: 13px; font-weight: 600; }

  /* catrank */
  table.rt td.cc { text-align: center; min-width: 62px; padding: 5px 8px; line-height: 1.15; }
  table.rt td.cc .rk { display: block; font-weight: 700; font-size: 14px; }
  table.rt td.cc .cv { display: block; font-size: 10.5px; opacity: .8; }
  table.rt th.c { text-align: center; }

  /* h2h losses */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .lchip { padding: 3px 9px; border-radius: 10px; background: #232837; font-size: 12px; }
  .lchip b { color: #e0706a; }
  .scroll-y { max-height: 340px; overflow-y: auto; }

  /* bracket */
  .podium { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-bottom: 8px; }
  .ptile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .ptile.first { border-color: #f0b840; }
  .ptile .pl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .ptile .pn { font-size: 13px; margin-top: 2px; }
  .sweep-tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; background: rgba(76,175,125,.2); color: var(--good); margin-left: 6px; }
  .bgrid { display: grid; grid-template-columns: repeat(4, minmax(200px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
  .bcol h5 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .mc { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; font-size: 12.5px; }
  .ml { display: flex; align-items: center; gap: 6px; padding: 6px 9px; color: var(--muted); }
  .ml + .ml { border-top: 1px solid var(--border); }
  .ml.win { color: var(--text); background: rgba(91,157,255,.10); }
  .ml.win .tm b { color: #fff; }
  .ml .sd { width: 22px; font-size: 11px; color: var(--muted); }
  .ml .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ml .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
  .mc .note { font-size: 10.5px; color: #e0a84a; padding: 0 9px 5px; }
  .byebox { font-size: 12px; color: var(--muted); line-height: 1.6; }
  @media (max-width: 720px) {
    .podium { grid-template-columns: 1fr 1fr; }
    .bgrid { grid-template-columns: 1fr; }
    table.rt td, table.rt th { padding: 6px 7px; }
    .rlabel { width: 100%; }
  }

  /* ---------- Reset button + confirmation dialog ---------- */
  header { justify-content: flex-start; }
  #resetBtn { margin-left: auto; font-size: 12px; padding: 5px 10px; color: #e0706a; border-color: #5a2f33; background: transparent; }
  #resetBtn:hover { border-color: #e0706a; background: rgba(224,112,106,.08); }
  .resetnote { color: #e0a84a; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 13px; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .modal-backdrop.open { display: flex; }
  .modal { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .modal h2 { margin: 0 0 8px; font-size: 17px; }
  .modal p { margin: 0 0 10px; font-size: 13.5px; line-height: 1.5; color: var(--text); }
  .modal .warn-box { background: rgba(224,112,106,.10); border: 1px solid #5a2f33; border-radius: 8px; padding: 9px 12px; font-size: 13px; color: #f0b3ae; margin-bottom: 14px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal button { padding: 8px 14px; font-size: 14px; }
  .modal button.danger { background: #b3403a; border-color: #b3403a; color: #fff; font-weight: 600; }
  .modal button.danger:hover { background: #c94c45; border-color: #c94c45; }
  .modal button.danger:disabled { opacity: .6; }
</style>
</head>
<body>
<header>
  <h1>🏀 Draft Day</h1>
  <div id="state">Loading state…</div>
  <button id="resetBtn" title="Erase every pick and start the draft over">Reset draft</button>
</header>

<div class="modal-backdrop" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle" aria-describedby="resetDesc">
  <div class="modal">
    <h2 id="resetTitle">Are you sure you want to reset?</h2>
    <p id="resetDesc">This erases <b id="resetPicks">every pick</b> and the shared log <b>for everyone connected</b>, and puts the draft back on pick #1.</p>
    <div class="warn-box">This can't be undone.</div>
    <div class="actions">
      <button id="resetCancel">Cancel</button>
      <button id="resetConfirm" class="danger">Yes, reset everything</button>
    </div>
  </div>
</div>

<div class="quick">
  <button data-cmd="top3">Top 3</button>
  <button data-cmd="status">Status</button>
  <button data-cmd="undo">Undo</button>
  <button data-cmd="help">Help</button>
  <span id="busy"></span>
</div>
<details class="reports" id="reports" open>
  <summary>Reports by projection source</summary>
  <div id="reportRows"></div>
</details>

<main><div id="log"></div></main>

<footer>
  <input id="name" placeholder="Your name" />
  <input id="cmd" placeholder="Type a player name to log a pick, or a command…" autocomplete="off" />
  <button id="send">Send</button>
</footer>

<script>
const logEl = document.getElementById('log');
const stateEl = document.getElementById('state');
const cmdEl = document.getElementById('cmd');
const nameEl = document.getElementById('name');
nameEl.value = localStorage.getItem('draftUser') || '';
nameEl.addEventListener('change', () => localStorage.setItem('draftUser', nameEl.value));

let sinceId = 0;

let picksLogged = 0;
function renderState(s) {
  if (!s) return;
  picksLogged = s.picks || 0;
  stateEl.innerHTML = s.draft_complete
    ? '<b>Draft complete</b>'
    : `Pick <b>#${s.overall}</b> · Round <b>${s.round}</b> · On the clock: <b>Team ${s.on_the_clock}</b>`;
}

function fmtPct(x, d = 1) { return x == null ? '--' : (x * 100).toFixed(d) + '%'; }
function fmtNum(x, d = 1) { return x == null ? '--' : Number(x).toFixed(d); }
function fmtSigned(x) { return x == null ? '--' : (x >= 0 ? '+' : '') + x.toFixed(2); }

function probCell(label, x, target) {
  if (x == null) return `<td data-label="${label}">--</td>`;
  const hit = target != null && x >= target;
  const w = Math.max(0, Math.min(100, x * 100));
  return `<td data-label="${label}"><span class="pv${hit ? ' hitv' : ''}">${fmtPct(x)}</span>` +
         `<span class="bar${hit ? ' hit' : ''}"><span style="width:${w}%"></span></span></td>`;
}

function seedCell(r) {
  if (r.ally_seeds && r.ally_seeds.length) {
    return r.ally_seeds.map(a => `<span class="aseed" title="${escapeHtml(a.label)}">T${a.team} <b>#${a.seed}</b></span>`).join(' ');
  }
  return r.seeds && r.seeds.length ? escapeHtml(r.seeds.join(', ')) : '--';
}

function renderTop3(d) {
  const nextLbl = d.next_pick ? `Back at #${d.next_pick}` : 'Back later';
  const subBits = [];
  if (d.overall != null) subBits.push(`Pick #${d.overall}` + (d.round ? ` · Round ${d.round}` : ''));
  subBits.push(d.next_pick ? `next pick for this team: #${d.next_pick}` : 'no later pick for this team');
  const lowSims = d.rows.some(r => r.sims < d.min_sims);

  let body = '';
  d.rows.forEach((r, i) => {
    const market = [];
    if (r.adp != null) market.push(`ADP ${fmtNum(r.adp)}`);
    if (r.consensus != null) market.push(`consensus ${fmtNum(r.consensus)}`);
    if (r.yahoo != null) market.push(`Yahoo ${fmtNum(r.yahoo)}`);
    if (r.nba9 != null) market.push(`NBA 9-cat ${fmtNum(r.nba9)}`);
    if (r.value_z != null) market.push(`value ${fmtNum(r.value_z, 2)}`);
    if (r.swing != null) market.push(`category-swing fit ${fmtSigned(r.swing)}`);
    if (r.future_value != null) market.push(`future value ${fmtNum(r.future_value, 2)}`);

    let detail = `<span class="k">Market</span><span>${escapeHtml(market.join(' · '))}</span>`;
    if (r.still_there != null && d.next_pick) {
      detail += `<span class="k">Availability</span><span>${fmtPct(r.still_there)} chance he is still there at pick #${d.next_pick} (${fmtPct(1 - r.still_there)} he is gone)</span>`;
    }
    if (r.seeds && r.seeds.length) {
      const bye = r.byes == null ? '' : ` · ${r.byes} of ${r.seeds.length} alliance teams get a bye`;
      const per = (r.ally_seeds && r.ally_seeds.length)
        ? r.ally_seeds.map(a => `${escapeHtml(a.label)} <b>#${a.seed}</b>`).join(' &nbsp;·&nbsp; ')
        : r.seeds.join(', ');
      detail += `<span class="k">Alliance</span><span>projected seeds: ${per}${bye}</span>`;
    }
    let sim = `podium 2+ ${fmtPct(r.podium)} · sweep ${fmtPct(r.sweep)}`;
    if (r.ci_low != null && r.ci_high != null) sim += ` (95% CI ${fmtPct(r.ci_low)} to ${fmtPct(r.ci_high)})`;
    if (r.season_sweep != null) sim += ` · top-3 seeds ${fmtPct(r.season_sweep)}`;
    if (r.champ != null) sim += ` · title ${fmtPct(r.champ)}`;
    sim += ` · ${r.sims} sims`;
    const warn = r.sims < d.min_sims ? ` <span class="warn">low sample (under ${d.min_sims})</span>` : '';
    detail += `<span class="k">Simulation</span><span>${escapeHtml(sim)}${warn}</span>`;
    detail += `<span class="k">Roster health</span><span>category floor ${fmtSigned(r.floor)} · complementarity ${fmtSigned(r.comp)} · weakest ally ${fmtSigned(r.weakest_ally)} · playoff path ${fmtSigned(r.path)}</span>`;

    body +=
      `<tr class="main${i === 0 ? ' best' : ''}" data-i="${i}">` +
        `<td class="rank">${r.rank}</td>` +
        `<td class="l pcell"><span class="pname">${escapeHtml(r.player)}</span>` +
          (r.position ? `<span class="pos">${escapeHtml(r.position)}</span>` : '') +
          (i === 0 ? `<span class="tag">Top pick</span>` : '') +
          `<span class="chev">${i === 0 ? '▾' : '▸'}</span></td>` +
        `<td data-label="ADP">${fmtNum(r.adp)}</td>` +
        `<td data-label="Cons.">${fmtNum(r.consensus)}</td>` +
        `<td data-label="Value">${fmtNum(r.value_z)}</td>` +
        probCell(nextLbl, r.still_there, null).replace('<td ', '<td class="gsep" ') +
        probCell('Podium 2+', r.podium, d.targets.podium).replace('<td ', '<td class="gsep" ') +
        probCell('Sweep', r.sweep, d.targets.sweep) +
        probCell('Win title', r.champ, null) +
        `<td class="gsep" data-label="Ally seeds">${seedCell(r)}</td>` +
        `<td class="gsep" data-label="Targets"><span class="pill ${r.targets_met ? 'met' : 'no'}">${r.targets_met ? 'Met' : 'Not met'}</span></td>` +
      `</tr>` +
      `<tr class="detail${i === 0 ? '' : ' closed'}" data-i="${i}"><td colspan="11"><div class="dgrid">${detail}</div></td></tr>`;
  });

  const key = [
    ['ADP / Cons.', 'average draft position / consensus rank (lower = drafted earlier)'],
    ['Value', 'z-score total across the 9 categories (higher = better)'],
    [nextLbl, 'chance he is still available at this team\'s next pick'],
    ['Podium 2+', 'chance at least 2 alliance teams finish in the playoff top 3'],
    ['Sweep', 'chance all 3 alliance teams finish 1-2-3 in the playoffs'],
    ['Win title', 'chance this team wins the championship'],
    ['Ally seeds', 'projected regular-season seed of each alliance team if you take this player (T9 #2 = Team 9 projected 2nd)'],
    ['Targets', `Podium 2+ ≥ ${(d.targets.podium * 100).toFixed(0)}% and Sweep ≥ ${(d.targets.sweep * 100).toFixed(0)}% (shown in green when reached)`],
  ].map(([k, v]) => `<dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd>`).join('');

  return `<div class="top3">` +
    `<div class="t3-head"><span class="t3-title">Top 3 picks · ${escapeHtml(d.team_label)}</span>` +
    `<span class="t3-sub">${escapeHtml(subBits.join(' · '))}</span></div>` +
    `<div class="t3-wrap"><table class="t3"><thead>` +
      `<tr class="grp"><th></th><th class="l"></th><th colspan="3">Draft market</th><th class="gsep">Availability</th><th colspan="3" class="gsep">Simulated outcomes</th><th class="gsep">Alliance</th><th class="gsep">Goal</th></tr>` +
      `<tr class="cols"><th></th><th class="l">Player</th><th>ADP</th><th>Cons.</th><th>Value</th><th class="gsep">${escapeHtml(nextLbl)}</th><th class="gsep">Podium 2+</th><th>Sweep</th><th>Win title</th><th class="gsep">Ally seeds</th><th class="gsep">Targets</th></tr>` +
    `</thead><tbody>${body}</tbody></table></div>` +
    `<div class="t3-foot">Tap a row for the full breakdown.` +
      (lowSims ? ` <span class="warn">Some rows ran fewer than ${d.min_sims} simulations (live time limit), so treat their percentages as rough.</span>` : '') +
      `<details><summary>What do these columns mean?</summary><dl>${key}</dl></details>` +
      (d.note ? `<details><summary>About this recommendation</summary><div style="margin-top:6px">${escapeHtml(d.note)}</div></details>` : '') +
    `</div></div>`;
}


const REPORT_SOURCES = [
  ['',        'Blended',  'Default: blended ensemble of all projection files'],
  ['espn',    'ESPN',     'ESPN_Fantasy_Basketball_Projections_Complete.csv'],
  ['roto',    'RotoBaller','rotoballerfantasyranking.csv'],
  ['rank',    'Rankings', 'fantasy_basketball_rankings.csv'],
  ['table',   'table.csv','table.csv'],
  ['fantrax', 'Fantrax',  'Fantrax-Players-2K27GMLeague.csv'],
];
const REPORT_KINDS = [
  ['Cat Rank',  'catrank'],
  ['H2H Stand', 'h2hstand'],
  ['Bracket',   'playoffbracket'],
];
(function buildReportButtons() {
  const box = document.getElementById('reportRows');
  REPORT_KINDS.forEach(([label, kind]) => {
    const row = document.createElement('div');
    row.className = 'rrow';
    row.innerHTML = `<span class="rlabel">${label}</span>`;
    REPORT_SOURCES.forEach(([key, name, file]) => {
      const b = document.createElement('button');
      b.textContent = name;
      b.title = file;
      b.dataset.cmd = key + kind;
      if (!key) b.className = 'blend';
      row.appendChild(b);
    });
    box.appendChild(row);
  });
  if (window.matchMedia('(max-width: 720px)').matches) document.getElementById('reports').open = false;
})();

function srcChip(src) {
  return `<span class="chip" title="${escapeHtml(src.file || 'Blended ensemble of all projection files')}">${escapeHtml(src.name)}</span>`;
}
function teamHtml(t) {
  return `<span class="tm"><b>Team ${t.team}</b>${t.name ? ` <span class="tmn">${escapeHtml(t.name)}</span>` : ''}` +
         `${t.alliance ? ' <span class="star" title="Alliance team">★</span>' : ''}</span>`;
}
function fmtCat(c, v) { return (c === 'FG%' || c === 'FT%') ? (v * 100).toFixed(1) + '%' : Math.round(v).toLocaleString(); }
function heat(rank, n) { const f = n > 1 ? (rank - 1) / (n - 1) : 0; return `hsla(${Math.round(130 * (1 - f))},50%,36%,.55)`; }
function signed(n) { return (n > 0 ? '+' : '') + n; }
function sgnCls(n) { return n > 0 ? 'pos-n' : (n < 0 ? 'neg-n' : ''); }

function renderCatrank(d) {
  const head = d.categories.map(c => `<th class="c">${c}</th>`).join('');
  const rows = d.teams.map((t, i) =>
    `<tr class="${t.alliance ? 'ally' : ''}"><td class="l muted">${i + 1}</td><td class="l">${teamHtml(t)}</td>` +
    `<td><b>${t.avg_rank.toFixed(1)}</b></td>` +
    d.categories.map(c => `<td class="cc" style="background:${heat(t.ranks[c], d.n_teams)}"><span class="rk">${t.ranks[c]}</span><span class="cv">${fmtCat(c, t.values[c])}</span></td>`).join('') +
    `</tr>`).join('');
  return `<div class="rep"><div class="rep-head"><span class="rep-title">Category rankings</span>${srcChip(d.source)}</div>` +
    `<div class="rep-sub">Big number = rank in that category (1 = best, green). Small number = projected season total, weighted by each player's real games. ` +
    `Turnovers: fewer is better. Teams are sorted by average rank. <span class="star">★</span> = alliance team.</div>` +
    `<div class="rep-wrap"><table class="rt"><thead><tr><th class="l">#</th><th class="l">Team</th><th>Avg rank</th>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function renderH2h(d) {
  const rows = d.standings.map(r =>
    `<tr class="${r.alliance ? 'ally' : ''}${r.seed === d.bye_seeds ? ' cut' : ''}"><td class="l"><b>${r.seed}</b></td><td class="l">${teamHtml(r)}</td>` +
    `<td>${r.w}-${r.l}${r.t ? '-' + r.t : ''}</td><td>${(r.win_pct * 100).toFixed(1)}%</td>` +
    `<td>${r.cats_for}-${r.cats_against}</td><td class="${sgnCls(r.cat_diff)}">${signed(r.cat_diff)}</td>` +
    `<td class="l">${r.bye ? '<span class="pill bye">Bye</span>' : ''}</td></tr>`).join('');
  let losses;
  if (!d.losses.length) {
    losses = `<div class="rep-sub">None projected -- the alliance is favored in every H2H matchup.</div>`;
  } else {
    const chips = d.loss_counts.map(c => `<span class="lchip">${teamHtml(c)} <b>${c.losses}</b> loss${c.losses === 1 ? '' : 'es'}</span>`).join('');
    const lrows = d.losses.map(l =>
      `<tr><td class="l muted">P${l.period}${l.weeks !== String(l.period) ? ` (wk ${escapeHtml(l.weeks)})` : ''}</td><td class="l">${teamHtml(l.team)}</td>` +
      `<td class="neg-n">${l.cats_won}-${l.cats_lost}</td><td class="l">${teamHtml(l.opponent)}</td></tr>`).join('');
    losses = `<div class="chips">${chips}</div><div class="rep-wrap scroll-y"><table class="rt"><thead><tr><th class="l">Period</th><th class="l">Alliance team</th><th>Cats</th><th class="l">Loses to</th></tr></thead><tbody>${lrows}</tbody></table></div>`;
  }
  return `<div class="rep"><div class="rep-head"><span class="rep-title">Projected H2H standings</span>${srcChip(d.source)}</div>` +
    `<div class="rep-sub">Simulated regular season. Seeds 1-${d.bye_seeds} get a playoff bye (dashed line). <span class="star">★</span> = alliance team.</div>` +
    `<div class="rep-wrap"><table class="rt"><thead><tr><th class="l">Seed</th><th class="l">Team</th><th>Record</th><th>Win%</th><th>Cats W-L</th><th>Diff</th><th class="l"></th></tr></thead><tbody>${rows}</tbody></table></div>` +
    `<h4>Alliance matchups projected to lose${d.losses.length ? ` (${d.losses.length})` : ''}</h4>${losses}</div>`;
}

function matchCard(m) {
  const line = (t, seed, cats, won) =>
    `<div class="ml${won ? ' win' : ''}"><span class="sd">(${seed})</span><span class="nm">${teamHtml(t)}</span><span class="sc">${cats}</span></div>`;
  return `<div class="mc">${line(m.a, m.seed_a, m.cats_a, m.winner === m.a.team)}${line(m.b, m.seed_b, m.cats_b, m.winner === m.b.team)}` +
         `${m.tied ? '<div class="note">Tied on categories; higher seed advances</div>' : ''}</div>`;
}

function renderBracket(d) {
  const pod = d.podium;
  const tile = (label, t, cls) => `<div class="ptile ${cls || ''}"><div class="pl">${label}</div><div class="pn">${teamHtml(t)}</div></div>`;
  const podium = `<div class="podium">${tile('🏆 Champion', pod.champion, 'first')}${tile('2nd', pod.runner_up)}${tile('3rd', pod.third)}${tile('4th', pod.fourth)}</div>`;
  const cols = d.rounds.map((r, i) => {
    let extra = '';
    if (i === 0) {
      extra = `<div class="byebox"><b>Byes into Round 2:</b><br>${d.byes.map(b => `(${b.seed}) ${teamHtml(b)}`).join('<br>')}</div>`;
    }
    return `<div class="bcol"><h5>${escapeHtml(r.name)}</h5>${r.matches.map(matchCard).join('')}${extra}</div>`;
  }).join('');
  const finalCol = `<div class="bcol"><h5>Championship</h5>${matchCard(d.final)}<h5 style="margin-top:12px">3rd place game</h5>${matchCard(d.third_game)}</div>`;
  const srows = d.seeds.map(r =>
    `<tr class="${r.alliance ? 'ally' : ''}"><td class="l"><b>${r.seed}</b></td><td class="l">${teamHtml(r)}</td><td>${r.w}-${r.l}${r.t ? '-' + r.t : ''}</td><td class="${sgnCls(r.cat_diff)}">${signed(r.cat_diff)}</td></tr>`).join('');
  return `<div class="rep"><div class="rep-head"><span class="rep-title">Projected playoff bracket</span>${srcChip(d.source)}</div>` +
    `<div class="rep-sub">Seeded from the projected regular-season standings. Winner of each match is highlighted. ` +
    `Alliance teams on the podium: <b>${d.alliance_on_podium} of ${d.alliance_size}</b>${d.sweep ? '<span class="sweep-tag">SWEEP</span>' : ''}. <span class="star">★</span> = alliance team.</div>` +
    `${podium}<div class="bgrid">${cols}${finalCol}</div>` +
    `<details class="rep-foot"><summary style="cursor:pointer;color:var(--accent)">Regular-season seeding</summary><div class="rep-wrap" style="margin-top:6px"><table class="rt"><thead><tr><th class="l">Seed</th><th class="l">Team</th><th>Record</th><th>Cat diff</th></tr></thead><tbody>${srows}</tbody></table></div></details></div>`;
}

const RENDERERS = {
  top3: renderTop3, catrank: renderCatrank, h2hstand: renderH2h, playoffbracket: renderBracket };

function appendEntry(e) {
  const div = document.createElement('div');
  div.className = 'entry';
  const t = new Date(e.ts * 1000).toLocaleTimeString();
  let bodyHtml;
  if (e.data && e.data.kind === 'reset') {
    bodyHtml = `<div class="resetnote">↺ ${escapeHtml(e.output)}</div>`;
  } else if (e.data && RENDERERS[e.data.kind]) {
    // Show the real table instead of the plain-text copy of it; keep any other
    // output from the same command (e.g. the pick confirmation, timing line).
    const rest = (e.output || '').replace(e.data.text || '', '').trim();
    bodyHtml = (rest ? `<div class="t3-rest">${escapeHtml(rest)}</div>` : '') + RENDERERS[e.data.kind](e.data);
  } else {
    bodyHtml = `<div>${escapeHtml(e.output) || '<i>(no output)</i>'}</div>`;
  }
  div.innerHTML =
    `<div class="meta"><span class="user">${escapeHtml(e.user)}</span> · ${t} · <span class="cmd">${escapeHtml(e.command)}</span></div>` +
    bodyHtml;
  // expand / collapse a pick's detail row
  div.querySelectorAll('tr.main').forEach(tr => {
    tr.addEventListener('click', () => {
      const det = div.querySelector(`tr.detail[data-i="${tr.dataset.i}"]`);
      const closed = det.classList.toggle('closed');
      tr.querySelector('.chev').textContent = closed ? '▸' : '▾';
    });
  });
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function escapeHtml(s) {
  return (s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let knownEpoch = -1;
function clearLog() { logEl.innerHTML = ''; sinceId = 0; }

async function poll() {
  try {
    const res = await fetch(`/api/history?since=${sinceId}&epoch=${knownEpoch}`);
    const data = await res.json();
    // A response from before a reset we already handled locally: ignore it.
    if (data.epoch >= knownEpoch) {
      if (data.reset) clearLog();          // someone reset the draft: start clean
      knownEpoch = data.epoch;
      for (const e of data.entries) { appendEntry(e); sinceId = e.id; }
      renderState(data.state);
    }
  } catch (err) { /* network hiccup, just retry next tick */ }
  finally { setTimeout(poll, 2000); }
}
poll();

let inflight = 0;
const busyEl = document.getElementById('busy');
function setBusy(on) {
  document.querySelectorAll('button[data-cmd]').forEach(b => { b.disabled = on; });
}
// ---- Reset (always goes through the confirmation dialog) ----
const resetModal = document.getElementById('resetModal');
const resetConfirmBtn = document.getElementById('resetConfirm');
const resetCancelBtn = document.getElementById('resetCancel');
function openResetDialog() {
  document.getElementById('resetPicks').textContent =
    picksLogged > 0 ? `all ${picksLogged} logged pick${picksLogged === 1 ? '' : 's'}` : 'every pick (none logged yet)';
  resetConfirmBtn.disabled = false;
  resetConfirmBtn.textContent = 'Yes, reset everything';
  resetModal.classList.add('open');
  setTimeout(() => resetCancelBtn.focus(), 0);   // default to the safe choice (deferred so the Enter that opened this doesn't also click it)
}
function closeResetDialog() { resetModal.classList.remove('open'); }
document.getElementById('resetBtn').addEventListener('click', openResetDialog);
resetCancelBtn.addEventListener('click', closeResetDialog);
resetModal.addEventListener('click', (e) => { if (e.target === resetModal) closeResetDialog(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && resetModal.classList.contains('open')) closeResetDialog(); });
resetConfirmBtn.addEventListener('click', async () => {
  resetConfirmBtn.disabled = true;
  resetConfirmBtn.textContent = 'Resetting...';
  busyEl.textContent = 'Resetting the draft...';
  setBusy(true);
  try {
    const res = await fetch('/api/reset', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ confirm: true, user: nameEl.value || 'anon' }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'reset failed');
    // Wipe our own log right away; the next poll brings in the "draft reset" entry.
    knownEpoch = data.state.epoch;
    clearLog();
    renderState(data.state);
    closeResetDialog();
  } catch (err) {
    resetConfirmBtn.disabled = false;
    resetConfirmBtn.textContent = 'Yes, reset everything';
    alert('Reset did not go through: ' + err.message);
  } finally {
    busyEl.textContent = '';
    setBusy(false);
  }
});

async function sendCommand(text) {
  if (!text.trim()) return;
  if (text.trim().toLowerCase() === 'reset') { cmdEl.value = ''; openResetDialog(); return; }
  cmdEl.value = '';
  inflight++;
  busyEl.textContent = `Running "${text}"...`;
  setBusy(true);
  try {
    await fetch('/api/command', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ text, user: nameEl.value || 'anon' }),
    });
  } catch (err) { /* poll will still show anything that landed */ }
  finally {
    inflight--;
    if (!inflight) { busyEl.textContent = ''; setBusy(false); }
  }
  // next poll (within 2s) will pick up the new entry for everyone, including us
}

document.getElementById('send').addEventListener('click', () => sendCommand(cmdEl.value));
cmdEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendCommand(cmdEl.value); } });
document.querySelectorAll('button[data-cmd]').forEach(b => {
  b.addEventListener('click', () => sendCommand(b.dataset.cmd));
});
</script>
</body>
